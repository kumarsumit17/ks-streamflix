# Quality budgets (specs/quality-budgets.md). The build and tests read these; never raise one
# without the owner's OK.

# Size, in MB.
size.server.maxMb=14
size.apk.maxMb=15
size.desktop.maxMb=53

# Speed.
speed.server.startMs=3000
speed.scan.filesPerSecond=500
speed.api.p95Ms=100

# Stability.
stability.concurrentStreams=16
stability.repeatRuns=5

# Transcoding: from the playback request to the first HLS segment being ready.
speed.transcode.firstSegmentMs=6000

# Folder watching: from a new file in a library folder to the item in the library.
speed.folderWatch.detectMs=15000

# The macOS installer (.dmg, with its own Java runtime), checked by checkInstallerSize after packageReleaseDmg.
size.installer.macMb=80
