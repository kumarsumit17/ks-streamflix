name: Move to the newest ks-utility

# ks-utility's shared workflow (https://github.com/kumasumit/ks-utility/blob/main/specs/release-workflow.md,
# "Moving to the newest ks-utility"): checks out dev, moves the ks-utility submodule to the newest tag,
# runs StreamFlix's tests, and commits "chore: move ks-utility to vX.Y.Z" to dev only when they pass;
# otherwise it opens an issue.
on:
  repository_dispatch:
    types: [ks-utility-released]
  schedule:
    - cron: "17 4 * * *"   # daily, in case a notice was missed
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    permissions: { contents: write, issues: write }
    uses: kumasumit/ks-utility/.github/workflows/ks-utility-bump.yml@v0.16.0
    with:
      kind: kotlin
      java: true
      # Every test, lint, the language files and the size budgets (FFmpeg tests skip without FFmpeg).
      test: ./gradlew --no-daemon check
    # A token that may change workflow files, so the move also updates the calls of ks-utility's shared workflows.
    secrets:
      KS_WORKFLOWS_TOKEN: ${{ secrets.KS_WORKFLOWS_TOKEN }}
