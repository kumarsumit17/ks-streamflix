name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (https://github.com/kumasumit/ks-utility/blob/main/specs/release-workflow.md).
# This file only names KS StreamFlix's platforms.
#
#   Tag push vMAJOR.MINOR.PATCH   Builds and verifies the signed APKs and AABs (phone and Google TV),
#                                 the macOS .dmg and the Windows .msi, then publishes the GitHub
#                                 Release (full release, latest).
#   Tag push <platform>-vX.Y.Z    The same for one platform (android, google-tv, mac, windows); its
#                                 release is not marked latest (each app reads the release list).
#   Manual run (rehearsal)        Builds and checks everything for the version given; never publishes.

on:
  push:
    # vX.Y.Z releases every platform; android-, google-tv-, mac-, windows-vX.Y.Z only that one.
    tags: ["v*.*.*", "*-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z. Builds everything, releases nothing."
        required: true
        type: string
      platform:
        description: "Platform to rehearse: all, android, google-tv, mac or windows."
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kumasumit/ks-utility/.github/workflows/kotlin-app-release.yml@v0.16.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      platform: ${{ inputs.platform || 'all' }}
      app-name: ks-streamflix
      display-name: KS StreamFlix
      android-module: ":mobile:android"
      tv-module: ":tv:google-tv"
      mac-module: ":desktop:mac"
      windows-module: ":desktop:windows"
      # Every test, lint, the language files and the size budgets, before the Android build.
      test-tasks: "check"
      desktop-test-tasks: ":shared:server:test :shared:client:desktopTest"
    secrets: inherit
