[versions]
# Kotlin is kept in step with ks-utility/kotlin/gradle/libs.versions.toml.
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.13.0"
ktor = "3.6.1"
sqldelight = "2.4.1"
slf4j = "2.0.17"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# JSON for the API, on the server and in the apps (Apache-2.0).
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Server: Ktor (Apache-2.0) on its pure-Kotlin CIO engine; only the server plugins used.
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-partial-content = { module = "io.ktor:ktor-server-partial-content", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }

# Server database: SQLDelight (Apache-2.0) on SQLite through sqlite-jdbc.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# Log output of the desktop apps (MIT).
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# First-party: the ks-utility submodule, included with includeBuild in settings.gradle.kts (no version).
ks-utility = { module = "com.ks:utility" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
